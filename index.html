<!DOCTYPE html>
<html>
<head>
  <title>SERP Rank Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>SERP Rank Checker</header>

<div class="container">

  <label>Keywords (one per line)</label>
  <textarea id="keywords" rows="4">Precast Solutions</textarea>

  <label>Target URL</label>
  <input id="targetUrl" value="https://fujisilvertech.com/">

  <label>Locations (one per line)</label>
  <textarea id="locations" rows="2">Ahmedabad, India</textarea>

  <div class="row">
    <div>
      <label>Device</label>
      <select id="device">
        <option value="desktop">Desktop</option>
        <option value="mobile">Mobile</option>
      </select>
    </div>

    <div>
      <label>Browser</label>
      <select id="browser">
        <option value="windows">Windows</option>
        <option value="safari">Safari</option>
      </select>
    </div>
  </div>

  <div class="row">
    <button onclick="startCheck()">Analyze</button>
    <button class="stop" onclick="stopCheck()">Stop</button>
  </div>

  <div id="loader" class="loader hidden"></div>
  <progress id="progressBar" value="0" max="100"></progress>
  <p id="progressText"></p>

</div>

<div class="results" id="results"></div>

<button id="csvBtn" class="hidden" onclick="downloadCSV()">⬇ Export CSV</button>

<script src="script.js"></script>
</body>
</html>
