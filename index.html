<!DOCTYPE html>
<html>
<head>
  <title>SERP Rank Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>SERP Rank Checker</header>

<div class="container">

  <label>Enter Keywords (one per line)</label>
  <textarea id="keywords" rows="6"></textarea>

  <label>Target URL</label>
  <input id="targetUrl" placeholder="https://example.com">

  <label>Location</label>
  <input id="location" value="Ahmedabad, India">

  <div class="row">
    <div>
      <label>Device</label>
      <select id="device">
        <option value="desktop">Desktop</option>
        <option value="mobile">Mobile</option>
      </select>
    </div>

    <div>
      <label>Browser</label>
      <select id="browser">
        <option value="chrome">Windows</option>
        <option value="safari">Safari</option>
      </select>
    </div>
  </div>

  <button onclick="checkRank()">Analyze</button>

  <!-- Loader -->
  <div id="loader" class="loader hidden"></div>
  <p id="progress"></p>

</div>

<div class="results" id="results"></div>

<button id="csvBtn" onclick="downloadCSV()" class="hidden">
⬇ Export CSV
</button>

<script src="script.js"></script>
</body>
</html>
